<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canine Farming Protocol</title>
  
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ilesanmipepsi/canine_farming/main/favicon.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ilesanmipepsi/canine_farming/main/apple-touch-icon.png">

  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #0a1f1a; 
      color: #e8e8e8; 
      margin: 0; padding: 0; text-align: center; padding-top: 20px; 
    }
    .container { max-width: 460px; margin: 0 auto; padding: 15px; }

    .header {
      background: linear-gradient(135deg, #0f2e24, #1a3f32);
      color: white;
      padding: 30px 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      border: 1px solid #1f5c4a;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #f4c95d;
      margin-bottom: 15px;
      box-shadow: 0 6px 20px rgba(244, 201, 93, 0.4);
    }

    .header h1 { margin: 10px 0 8px 0; font-size: 2.1em; color: #f4c95d; letter-spacing: 2px; }
    .gold-text { color: #f4c95d; }

    .button {
      color: white; padding: 17px; border: none; border-radius: 14px; 
      font-size: 1.08em; margin: 12px 0; cursor: pointer; width: 100%; 
      font-weight: 600; display: block; transition: all 0.3s ease;
    }
    .button:hover { transform: translateY(-3px); }
    .button.connect { background: #1f5c4a; }
    .button.test    { background: linear-gradient(90deg, #f4c95d, #d4a017); color: #0a1f1a; font-weight: bold; }
    .button.mint    { background: #2e7d5c; }
    .button.stake   { background: #1f5c4a; }
    .button.claim   { background: #c94f2e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://raw.githubusercontent.com/ilesanmipepsi/canine_farming/main/apple-touch-icon.png" 
           alt="Canine Farming Protocol" class="logo">
      
      <h1>CANINE FARMING</h1>
      <p class="gold-text">Protocol • Sustainable Growth • 10 Million Max Supply</p>
    </div>

    <div class="info">
      <h2>Session Status: <span id="username" class="gold-text">Uninitialized</span></h2>
    </div>
    
    <button id="connect" class="button connect">Initialize Pi Session</button>
    <button class="button test">Verify Step 10 (0.1 Pi)</button>
    <button class="button mint">Mint $CFM</button>
    <button class="button stake">Stake $CFM</button>
    <button class="button claim">Harvest Rewards</button>
  </div>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="app.js"></script>
</body>
  </html>
